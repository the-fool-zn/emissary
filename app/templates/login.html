{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block body %}<div class="card login"><h1>Emissary sign in</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ login_token }}">
<label for="u">Username</label><input id="u" name="username" autocomplete="username" required>
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
<p><button>Sign in</button></p></form></div>{% endblock %}
